# 门禁的规则集写死在这儿。两个理由，都是踩过的：
#   1. ruff 的**默认集会随版本漂** —— 本机 0.16 的默认集已经远超 E/F
#      （多出 DTZ/S/BLE/SIM/PERF/I 等，同一份代码报 67 条），CI 用 `pip install ruff`
#      拿最新版 ⇒ 不写死就等于"别人发个版，我的门红了"，也等于本地的绿预测不了 CI 的绿。
#   2. 本机若被某个上层配置干扰，规则又不一样（实测过：同一条命令在临时目录里的
#      读数与在仓库里不同）。CI 端 `ruff check` 只认这一份。
target-version = "py312"      # = CI 矩阵的下限，也是想对外声称的地板
line-length = 120

[lint]
# 只卡"会炸 / 会静默出错"这一类。靶子是具体的：_base.py 曾有 4 处
# json.dumps 在异常分支上而模块没 import json（F821），API 一失败就先 NameError。
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E402",   # app.py 有 5 处：load_dotenv() 必须先于技能导入跑，刻意的
    "E701",   # 15 处单行 if：问AI 的错误返回路径与中文数字转换，紧凑且已读过更清楚
    "E702",   # 3 处分号连写：同上
]
